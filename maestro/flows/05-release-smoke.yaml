appId: ru.co_dev.passhash
tags:
  - smoke
---
# Minimal smoke for release APKs: app boots, generation works and matches
# the reference vector with default settings.
- clearState
- launchApp
- assertVisible:
    id: "site-tag-input"
- tapOn:
    id: "site-tag-input"
- inputText: "example.com"
- tapOn:
    id: "master-key-input"
- inputText: "test"
- tapOn:
    id: "generate-button"
- assertVisible:
    id: "password-output"
    text: 'Tx2Gst\)k'
