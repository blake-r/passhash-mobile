appId: ru.co_dev.passhash
tags:
  - core
---
# Settings tab: language and theme live on their own tab, not on the Keeper one.
- clearState
- launchApp
- tapOn:
    id: "tab-settings"
- assertVisible:
    id: "language-selector"
- assertVisible:
    id: "theme-selector"
- tapOn:
    id: "theme-selector"
- tapOn: "Dark"
- assertVisible:
    text: "Dark"
