name: release-android

on:
  # Publishing a GitHub release builds and uploads its version to Google Play as a Draft.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: Upload a tagged build as Draft or explicitly publish an existing Draft
        type: choice
        options:
          - upload-draft
          - publish-draft
        default: upload-draft
        required: true
      tag:
        description: Release tag to build and upload as Draft
        required: false
      version_code:
        description: Existing Google Play Draft versionCode to publish
        required: false

jobs:
  release:
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'upload-draft' && inputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # the tag already exists; nothing is written back to GitHub

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          fetch-depth: 0 # versionCode derives from the total commit count

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          # The legacy "tools" package no longer exists in the SDK repository,
          # so the action's old default ("tools platform-tools") fails.
          packages: "platform-tools"

      - uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Verify upload keystore
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -keystore "$RUNNER_TEMP/upload.keystore" \
            -alias "$KEYSTORE_ALIAS" -storepass "$KEYSTORE_STORE_PASSWORD" > /dev/null

      - name: Write Play service account key
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-store-service-account.json"

      - name: Generate native Android project
        run: npx expo prebuild --platform android

      - name: Stamp version into build.gradle
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          # The tag names the version; a manual run without one falls back to today.
          VERSION_NAME="${RELEASE_TAG:-$(bash scripts/compute-version.sh | awk '/VERSION_NAME:/ {print $2}')}"
          COMMIT_DATE=$(git log -1 --format=%cd --date=format:%y%m%d)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION_CODE=$((10#$COMMIT_DATE * 1000 + COMMIT_COUNT % 1000))
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName[[:space:]]+\"[^\"]+\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle

      - name: Build release AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -Pandroid.useAndroidX=true

      - name: Validate AAB with bundletool
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          curl -sSL -o "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$AAB"

      - name: Resolve base release tag
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          BASE_TAG=""
          for tag in $(gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName'); do
            [ "$tag" = "$CURRENT_TAG" ] && continue
            if git merge-base --is-ancestor "refs/tags/$tag" HEAD; then
              BASE_TAG="$tag"
              break
            fi
          done
          echo "base_tag=$BASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Base tag: ${BASE_TAG:-none (first release)}"

      - name: Generate Play changelogs for this versionCode
        id: notes
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          BASE_TAG: ${{ steps.base.outputs.base_tag }}
        run: |
          # The current tag is already published and reachable from HEAD, so the base
          # tag has to be passed explicitly instead of letting the script pick one.
          if [ -n "$BASE_TAG" ]; then
            node scripts/release-notes.js --version-code "$VERSION_CODE" --base-tag "$BASE_TAG"
          else
            node scripts/release-notes.js --version-code "$VERSION_CODE" --no-base
          fi

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Upload Google Play Draft
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/play-store-service-account.json
        run: |
          bundle exec fastlane release \
            version_code:${{ steps.version.outputs.version_code }} \
            skip_upload_changelogs:${{ steps.notes.outputs.has_notes != 'true' }} \
            aab:android/app/build/outputs/bundle/release/app-release.aab

      - name: Skip upload notice
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'upload-draft' && inputs.tag == '' }}
        run: echo "::notice::Choose a release tag to upload a Google Play Draft."

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'publish-draft' && inputs.version_code != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Write Play service account key
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-store-service-account.json"

      - name: Publish Google Play Draft
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/play-store-service-account.json
          VERSION_CODE: ${{ inputs.version_code }}
        run: bundle exec fastlane publish "version_code:$VERSION_CODE"

  dispatch-validation:
    if: ${{ github.event_name == 'workflow_dispatch' && ((inputs.mode == 'upload-draft' && inputs.tag == '') || (inputs.mode == 'publish-draft' && inputs.version_code == '')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject incomplete manual request
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "publish-draft" ]; then
            echo "::error::Provide the versionCode of the Google Play Draft to publish."
          else
            echo "::error::Provide the release tag to upload as a Google Play Draft."
          fi
          exit 1
