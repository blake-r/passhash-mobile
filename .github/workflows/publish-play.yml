name: publish-play

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose versionCode should be published on Google Play
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the release body to find the versionCode
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # fallback versionCode derives from the commit count

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Write Play service account key
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-store-service-account.json"

      - name: Resolve versionCode
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          BODY=$(gh release view "$TAG" --json body --jq .body)
          VERSION_CODE=$(printf '%s' "$BODY" | sed -n 's/.*play-version-code: *\([0-9][0-9]*\).*/\1/p' | head -1)
          if [ -z "$VERSION_CODE" ]; then
            # Releases created by hand carry no marker, so rebuild the code from the
            # tag commit the same way scripts/compute-version.sh does.
            git fetch --tags --force origin "refs/tags/$TAG"
            COMMIT_DATE=$(git log -1 --format=%cd --date=format:%y%m%d "$TAG")
            COMMIT_COUNT=$(git rev-list --count "$TAG")
            VERSION_CODE=$(( 10#$COMMIT_DATE * 1000 + COMMIT_COUNT % 1000 ))
            echo "No play-version-code marker in $TAG, derived $VERSION_CODE from the tag commit"
          fi
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Publishing versionCode $VERSION_CODE from release $TAG"

      - name: Publish draft release on Google Play
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/play-store-service-account.json
        run: bundle exec fastlane publish version_code:${{ steps.version.outputs.version_code }}
