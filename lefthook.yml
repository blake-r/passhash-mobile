pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{ts,tsx,json,yaml,yml,md}"
      run: npx prettier --write {staged_files} && git add {staged_files}
    eslint:
      glob: "*.{ts,tsx,js}"
      run: npx eslint {staged_files}
    typecheck:
      run: npm run typecheck
    jest:
      run: npx jest --silent
